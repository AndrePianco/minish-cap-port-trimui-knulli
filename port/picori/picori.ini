[controls]
overlay = clear

a = x
b = z
# X opens the save-state picker ready to save, Y opens it ready to load.
x = insert
y = end

l1 = a
r1 = s
# L2 saves a state to a new slot, R2 (held) fast-forwards.
l2 = home
r2 = tab

start = enter
back = backspace
guide = f8

up = up
down = down
left = left
right = right

left_analog = arrow_keys
